name: Release on tag push

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build
        shell: bash
        run: |
          scripts/ci/build-artifacts.sh "${{ matrix.os }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: artifacts/*

  release:
    name: Create release and attach artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag signature (best-effort)
        shell: bash
        run: |
          scripts/ci/verify-tag.sh "${{ github.ref_name }}"

      - name: Get tag and previous tag
        id: tags
        run: |
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p' || true)
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_ENV
          echo "Found previous tag: ${PREV_TAG}"

      - name: Generate release notes
        shell: bash
        run: |
          scripts/ci/generate-release-notes.sh "${{ github.ref_name }}" "${{ env.PREV_TAG }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
