name: Release on tag push

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            GOOS=windows
            OUT=goz.exe
          else
            GOOS=linux
            OUT=goz
          fi
          GOOS=$GOOS go build -ldflags "-s -w" -o artifacts/${OUT} ./cmd/goz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: artifacts/*

  release:
    name: Create release and attach artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag signature (best-effort)
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "Attempting to verify tag signature for $TAG"
          # install gpg if missing
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gnupg
          fi
          # attempt verification; don't fail the workflow if public key is missing
          if git tag -v "$TAG" 2>&1 | tee /tmp/tag-verify.out; then
            echo "Tag $TAG: signature verified"
          else
            echo "Warning: tag verification failed or public key missing. Proceeding to create release anyway."
            cat /tmp/tag-verify.out || true
          fi

      - name: Get tag and previous tag
        id: tags
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p' || true)
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_ENV
          echo "Found previous tag: ${PREV_TAG}"

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF_NAME}
          PREV=${PREV_TAG}
          if [ -z "$PREV" ]; then
            RANGE=""
          else
            RANGE="$PREV..$TAG"
          fi
          DATE=$(date +%Y-%m-%d)
          echo "## [$TAG] - $DATE" > RELEASE_NOTES.md
          echo >> RELEASE_NOTES.md
          if [ -z "$RANGE" ]; then
            git log --pretty=format:"- %s (%an)" --no-merges >> RELEASE_NOTES.md || true
          else
            git log "$RANGE" --pretty=format:"- %s (%an)" --no-merges >> RELEASE_NOTES.md || true
          fi
          echo >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
