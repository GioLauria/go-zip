name: Update changelog on tag

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rename Unreleased to tag and recreate Unreleased
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          TAG=${TAG}
          DATE=$(date +%Y-%m-%d)
          CHLOG=CHANGELOG.md
          if [ ! -f "$CHLOG" ]; then
            echo "No CHANGELOG.md found, skipping"
            exit 0
          fi

          # Replace first occurrence of '## [Unreleased]' with '## [TAG] - DATE'
          awk -v TAG="$TAG" -v DATE="$DATE" 'BEGIN{repl=0} {
            if(!repl && $0=="## [Unreleased]"){
              print "## ["TAG"] - "DATE; repl=1; next
            }
            print
          }' "$CHLOG" > "$CHLOG.tmp"

          # Insert a fresh Unreleased header after the top heading (line 1)
          awk 'NR==1{print; print "## [Unreleased]\n"; next} {print}' "$CHLOG.tmp" > "$CHLOG.new"
          mv "$CHLOG.new" "$CHLOG"
          rm -f "$CHLOG.tmp"

          git add "$CHLOG"
          # Commit and push the changelog update
          git commit -m "chore(release): move Unreleased -> ${TAG} and add new Unreleased" || echo "No changes to commit"
          git push origin HEAD:master || echo "Push may be blocked by branch protection"

