name: Build and attach release artifacts

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            GOOS=windows; OUT=goz.exe
          else
            GOOS=linux; OUT=goz
          fi
          env GOOS=$GOOS go build -ldflags "-s -w" -o artifacts/${OUT} ./cmd/goz

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.tag_name }}
          files: artifacts/*
